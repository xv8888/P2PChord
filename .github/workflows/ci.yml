name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Node dependencies
        run: npm ci
      - name: Run Node tests
        run: npm test
      - name: Run launcher tests
        run: python -m unittest test_launcher.py
      - name: Check patch whitespace
        run: git diff --check
